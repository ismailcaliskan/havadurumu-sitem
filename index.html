<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İsmail Çalışkan | Hava Durumu İstasyonu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .kart {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .baslik { font-size: 22px; font-weight: bold; color: #38bdf8; margin-bottom: 5px; }
        .alt-baslik { font-size: 12px; color: #94a3b8; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .arama-kutusu { display: flex; gap: 10px; margin-bottom: 20px; }
        input {
            flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155;
            background: #0f172a; color: #fff; outline: none; font-size: 15px;
        }
        button {
            padding: 12px 18px; border: none; border-radius: 10px;
            background: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #0369a1; }
        .hava-bilgi { display: none; margin-top: 20px; }
        .sehir { font-size: 26px; font-weight: bold; }
        .sicaklik { font-size: 52px; font-weight: bold; color: #38bdf8; margin: 10px 0; }
        .durum { font-size: 18px; color: #cbd5e1; }
        .detaylar {
            display: flex; justify-content: space-around; margin-top: 20px;
            padding-top: 15px; border-top: 1px solid #334155;
        }
        .detay-kutusu { font-size: 13px; color: #94a3b8; }
        .detay-kutusu span { display: block; font-size: 16px; color: #fff; font-weight: bold; margin-top: 5px; }
        .hata { color: #f87171; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="kart">
        <div class="baslik">🌤️ Hava Durumu İstasyonu</div>
        <div class="alt-baslik">İsmail Çalışkan</div>
        
        <div class="arama-kutusu">
            <input type="text" id="sehirInput" placeholder="Şehir adı girin (Örn: Samsun, Ankara)">
            <button onclick="havaDurumunuGetir()">Sorgula</button>
        </div>

        <div id="hataMesaji" class="hata">Şehir bulunamadı, lütfen tekrar deneyin.</div>

        <div id="havaBilgi" class="hava-bilgi">
            <div class="sehir" id="sehirAdi">--</div>
            <div class="sicaklik" id="sicaklik">--°C</div>
            <div class="durum" id="durum">--</div>

            <div class="detaylar">
                <div class="detay-kutusu">
                    Rüzgar
                    <span id="ruzgar">-- km/s</span>
                </div>
                <div class="detay-kutusu">
                    Nem
                    <span id="nem">--%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function havaDurumunuGetir() {
            const sehir = document.getElementById('sehirInput').value.trim();
            const hataElemani = document.getElementById('hataMesaji');
            const bilgiElemani = document.getElementById('havaBilgi');

            if (!sehir) return;

            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(sehir)}&count=1&language=tr&format=json`);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    hataElemani.style.display = 'block';
                    bilgiElemani.style.display = 'none';
                    return;
                }

                const { latitude, longitude, name, country } = geoData.results[0];

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`);
                const weatherData = await weatherRes.json();

                const current = weatherData.current;

                document.getElementById('sehirAdi').textContent = `${name}, ${country}`;
                document.getElementById('sicaklik').textContent = `${Math.round(current.temperature_2m)}°C`;
                document.getElementById('ruzgar').textContent = `${current.wind_speed_10m} km/s`;
                document.getElementById('nem').textContent = `%${current.relative_humidity_2m}`;
                document.getElementById('durum').textContent = havaKoduAciklama(current.weather_code);

                hataElemani.style.display = 'none';
                bilgiElemani.style.display = 'block';

            } catch (err) {
                hataElemani.style.display = 'block';
                bilgiElemani.style.display = 'none';
            }
        }

        function havaKoduAciklama(code) {
            if (code === 0) return 'Açık / Güneşli ☀️';
            if (code >= 1 && code <= 3) return 'Parçalı Bulutlu ⛅';
            if (code >= 45 && code <= 48) return 'Sisli 🌫️';
            if (code >= 51 && code <= 67) return 'Yağmurlu 🌧️';
            if (code >= 71 && code <= 77) return 'Kar Yağışlı ❄️';
            if (code >= 80 && code <= 82) return 'Sağanak Yağışlı 🌧️';
            if (code >= 95) return 'Fırtınalı / Gökgürültülü 🌩️';
            return 'Bulutlu ☁️';
        }
    </script>
</body>
</html>
